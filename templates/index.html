<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AawazAir — Personalized Air Quality Advisor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header>
        <h1>AawazAir</h1>
        <p class="tagline">Know what today's air actually means for you</p>
    </header>

    <main>

        <!-- City selection -->
        <section id="city-section">
            <label for="city-input">Check air quality for:</label>
            <input type="text" id="city-input" placeholder="e.g. Lahore" value="Lahore">
            <button id="check-aqi-btn">Check AQI</button>
        </section>

        <!-- Live AQI display -->
        <section id="aqi-display">
            <div id="aqi-loading" class="hidden">Loading current air quality...</div>
            <div id="aqi-error" class="hidden"></div>
            <div id="aqi-result" class="hidden">
                <div id="aqi-badge">
                    <span id="aqi-number">--</span>
                    <span id="aqi-category">--</span>
                </div>
                <p id="aqi-city-label"></p>
            </div>
        </section>

        <!-- Health profile form -->
        <section id="profile-section">
            <h2>Get advice for you</h2>
            <form id="profile-form">
                <input type="text" id="profile-name" placeholder="Your name" required>

                <select id="profile-age-group" required>
                    <option value="">Age group</option>
                    <option value="child">Child</option>
                    <option value="adult">Adult</option>
                    <option value="elderly">Elderly</option>
                </select>

                <fieldset id="health-conditions">
                    <legend>Health conditions (select any that apply)</legend>
                    <label><input type="checkbox" value="asthma"> Asthma</label>
                    <label><input type="checkbox" value="pregnant"> Pregnant</label>
                </fieldset>

                <button type="submit">Get My Advisory</button>
            </form>
        </section>

        <!-- Personalized advisory -->
        <section id="advisory-section" class="hidden">
            <h2>Your Personalized Advisory</h2>
            <div id="advisory-loading" class="hidden">Getting your personalized advisory...</div>
            <div id="advisory-error" class="hidden"></div>
            <div id="advisory-result"></div>
        </section>

        <!-- Trend chart -->
        <section id="trend-section">
            <h2>7-Day Trend</h2>
            <canvas id="trend-chart"></canvas>
        </section>

    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
